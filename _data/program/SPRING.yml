abbr-name: JST SPRING
full-name: 次世代研究者挑戦的研究プログラム（SPRING）
month: 冬～春
url : https://www.jst.go.jp/jisedai/spring/index.html
organizer: 科学技術振興機構
living_funding: 180～240万円<br>（大学ごとに異なる）
research_funding: 30万円～50万円など<br>（大学ごとに異なる）
duration: 最大3年
eligible_person: 博士課程学生（採択された大学に所属・令和7年度は90大学）
eligible_area: 全分野
accepted_num: 3600人（3学年合計で10,800人）
continuity: 毎年（規模は毎年度見直し）
deadline: 冬～春（大学ごとに異なる）
income_category: 雑所得
other_income: 学振特別研究員や他制度の研究奨励費等との併給制限あり。新制度では、生活費相当額の安定的・固定的収入（240万円／年以上）がある学生や留学生等にも研究費のみの支援が可能。詳細は大学の募集要項を確認
note: 大学ごとにプログラムを創設して実施<br>新制度の研究奨励費は日本人学生等（永住者等の一定の在留資格を持つ学生を含む）が対象。留学生等は原則研究費のみ支援。令和8年度は制度移行期間で、令和9年度以降の新規支援は新制度による。令和7年度以前から支援中の留学生は標準修業年限まで旧制度を継続し、令和8年度支援開始者にも募集開始時期等に応じた経過措置あり<br>令和9年度分は86支援プロジェクトを採択（令和8年10月14日公表。令和7年度の90大学とは年度・集計対象が異なる）<br><a href="https://www.jst.go.jp/jisedai/spring/dl/jimu/manual_SPRING_20260401.pdf" target="_blank" rel="noopener noreferrer">出典：JST令和8年度事務処理説明書</a>・<a href="https://www.jst.go.jp/pr/info/info1879/index.html" target="_blank" rel="noopener noreferrer">令和9年度採択発表</a>・<a href="https://www.mext.go.jp/content/20260611-mxt_koutou01-000050360_10.pdf" target="_blank" rel="noopener noreferrer">令和7年度90大学の出典（文部科学省資料）</a>
