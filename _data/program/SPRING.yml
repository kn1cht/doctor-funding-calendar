abbr-name: JST SPRING
full-name: 次世代研究者挑戦的研究プログラム（SPRING）
month: 冬～春
url : https://www.jst.go.jp/jisedai/spring/index.html
organizer: 科学技術振興機構
living_funding: 180～240万円<br>（研究奨励費の対象者。大学による）
research_funding: 大学・支援区分ごとに異なる
duration: 最大3年（4年制博士課程は4年、標準修業年限内）
eligible_person: 博士課程学生（採択された大学に所属・令和7年度は90大学）
eligible_area: 全分野
accepted_num: 大学・年度・支援区分ごとに異なる
continuity: 毎年（規模は毎年度見直し）
deadline: 冬～春（大学ごとに異なる）
income_category: 雑所得
other_income: 学振等との併給制限あり。新制度では留学生等や年240万円以上の安定収入がある学生も研究費のみ支援可
note: 研究奨励費は日本人学生等（永住者等を含む）が対象。留学生等は原則研究費のみ。令和8年度は移行期間、令和9年度以降の新規支援は新制度。支援中の留学生は採用・募集開始時期に応じた経過措置あり。令和9年度は86プロジェクト採択（令和7年度の90大学とは別集計）<br><a href="https://www.jst.go.jp/jisedai/spring/dl/jimu/manual_SPRING_20260401.pdf" target="_blank" rel="noopener noreferrer">出典：JST令和8年度事務処理説明書</a>・<a href="https://www.jst.go.jp/pr/info/info1879/index.html" target="_blank" rel="noopener noreferrer">令和9年度採択発表</a>・<a href="https://www.mext.go.jp/content/20260611-mxt_koutou01-000050360_10.pdf" target="_blank" rel="noopener noreferrer">令和7年度90大学の出典（文部科学省資料）</a>
