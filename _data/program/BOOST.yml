abbr-name: JST BOOST
recruitment_closed: true
full-name: 次世代AI人材育成プログラム（博士後期課程学生支援）（BOOST）
month: 冬～春
url : https://www.jst.go.jp/jisedai/boost-s/index.html
organizer: 科学技術振興機構
living_funding: ～390万円<br>（研究費との合計最大額）
research_funding: ～390万円<br>（生活費との合計最大額）
duration: 最大3年
eligible_person: 博士課程学生（採択された大学に所属・令和6年度時点で29大学）
eligible_area: AI分野及びAI分野における新興・融合領域（次世代AI分野）
accepted_num: 200人（3学年合計で600人）
continuity: 通常の新規支援開始は令和8年度まで（採択者への支援は原則令和10年度まで継続）
deadline: 通常新規募集終了。令和9・10年度も辞退等に伴う欠員補充は可能（大学ごとに異なる）
income_category: 雑所得
other_income: 学振特別研究員、研究奨励費が出る他のプログラム、生活費に係る十分な水準（240万円／年以上）の奨学金（貸与型を除く）、社会人学生、留学生支援不可
note: SPRINGと連携して実施<br>対象は令和6～8年度に支援を開始する学生。令和9・10年度も辞退等に伴う学生の入れ替えは可能。支援期間は原則令和10年度まで（留学・休学、出産・育児等の例外あり）<br><a href="https://www.jst.go.jp/jisedai/boost-s/dl/jimu/manual_BOOST-S_20260401.pdf" target="_blank" rel="noopener noreferrer">出典：JST令和8年度事務処理説明書</a>
