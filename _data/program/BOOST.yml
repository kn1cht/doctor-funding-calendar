abbr-name: JST BOOST
recruitment_closed: true
full-name: 次世代AI人材育成プログラム（博士後期課程学生支援）（BOOST）
month: 冬～春
url : https://www.jst.go.jp/jisedai/boost-s/index.html
organizer: 科学技術振興機構
living_funding: ～390万円<br>（研究費との合計最大額）
research_funding: ～390万円<br>（生活費との合計最大額）
duration: 最大3年（4年制博士課程は4年、標準修業年限内）
eligible_person: 博士課程学生（採択された大学に所属・令和6年度時点で29大学）
eligible_area: AI分野及びAI分野における新興・融合領域（次世代AI分野）
accepted_num: 年200人、3年度計600人（令和6～8年度の計画）
continuity: 新規支援開始は令和8年度まで。支援継続は原則令和10年度まで
deadline: 通常新規募集終了。令和9・10年度も欠員補充可（大学による）
income_category: 雑所得
other_income: 学振DC、年240万円以上の生活費奨学金・安定収入、国費・JICA・本国奨学金を受ける留学生は対象外。社会人・留学生も条件次第で対象
note: SPRINGと連携。留学・休学・出産・育児等は支援期間の例外あり<br><a href="https://www.jst.go.jp/jisedai/boost-s/dl/jimu/manual_BOOST-S_20260401.pdf" target="_blank" rel="noopener noreferrer">出典：JST令和8年度事務処理説明書</a>・<a href="https://www.jst.go.jp/jisedai/boost-s/dl/boost_brochure2025.pdf" target="_blank" rel="noopener noreferrer">当初の支援規模（2025年パンフレット）</a>
