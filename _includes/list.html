<div class="container">
  <div class="row">
    <div class="col-12">
      {%- for conf in site.data.category[include.category] -%}
      <a role="button" class="btn bg-secondary text-white p-0 m-1" href="#{{ conf }}" style="text-decoration: none;{% if site.data.program[conf].ended %} opacity: 0.55;{% endif %}">
        &nbsp;{{ site.data.program[conf].abbr-name }}{% if site.data.program[conf].ended %}（終了）{% elsif site.data.program[conf].recruitment_closed %}（通常新規募集終了）{% endif %}&nbsp;
      </a>
      {%- endfor -%}
    </div>
  </div>
</div>
